name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # How many parallel end-to-end shards. Keep this in step with the matrix below;
  # `node scripts/ci/shards.mjs` prints the file list and the estimate per shard.
  SHARDS: 4

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (rules, jsdom, bots, puzzles, build)
        run: npm run test:unit

  e2e:
    # Every shard is its own runner and still runs its files one at a time: two
    # Chrome-heavy files side by side on a 2-core runner is what used to make the suite
    # flaky. The shards are balanced by measured duration (scripts/ci/shards.mjs), so the
    # longest one decides the wall clock.
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end tests (headless Chrome, up to three browsers via PeerJS)
        env:
          CHROME: /usr/bin/google-chrome
          E2E_SHOTS: ${{ runner.temp }}/shots
          SHARD: ${{ matrix.shard }}
        run: |
          files="$(node scripts/ci/shards.mjs "$SHARD" "$SHARDS")"
          echo "shard $SHARD/$SHARDS: $files"
          node --test --test-concurrency=1 --test-timeout=300000 $files
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # The single check branch protection asks for: green only when the unit job and every
  # e2e shard were green. Renaming or splitting the jobs above therefore never needs a
  # change in the repository settings.
  test:
    name: test
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs passed
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "e2e:  ${{ needs.e2e.result }}"
          [ "${{ needs.unit.result }}" = "success" ] || exit 1
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1

  deploy:
    name: deploy
    needs: [unit, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BUCKET: minigames.alzlper.com
      AWS_DEFAULT_REGION: nl-ams
      S3_ENDPOINT: https://s3.nl-ams.scw.cloud
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (hashed bundle in dist/)
        run: npm run build

      # 1. hashed assets first: immutable, cached for a year, never overwritten
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --endpoint-url "$S3_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --size-only

      # 2. root files next to index.html (favicons, manifest): short cache, may change
      - name: Upload root files
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --exclude "assets/*" --exclude "index.html" --exclude "version.json" \
            --cache-control "public, max-age=86400"

      # 3. then the two files that must always be fetched fresh: the entry point and the
      #    version stamp an open page polls to notice a new build (#40)
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate"
      - name: Upload version.json
        run: |
          aws s3 cp dist/version.json "s3://$BUCKET/version.json" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      # 4. finally drop anything no longer in dist (old hashed assets, removed files);
      #    version.json stays out so the sync cannot overwrite it with a cached copy
      - name: Remove stale files
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --exclude "version.json" \
            --delete --size-only

      - name: Summary
        run: |
          echo "Deployed $(git rev-parse --short HEAD) to https://$BUCKET/" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/assets >> "$GITHUB_STEP_SUMMARY"
