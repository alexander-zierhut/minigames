name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests (headless Chrome, up to three browsers via PeerJS; one file at a time on the 2-core runner)
        run: npm run test:e2e:ci
        env:
          CHROME: /usr/bin/google-chrome
          E2E_SHOTS: ${{ runner.temp }}/shots
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  deploy:
    name: deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BUCKET: minigames.alzlper.com
      AWS_DEFAULT_REGION: nl-ams
      S3_ENDPOINT: https://s3.nl-ams.scw.cloud
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (hashed bundle in dist/)
        run: npm run build

      # 1. hashed assets first: immutable, cached for a year, never overwritten
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --endpoint-url "$S3_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --size-only

      # 2. root files next to index.html (favicons, manifest): short cache, may change
      - name: Upload root files
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=86400"

      # 3. then the entry point, which must always be fetched fresh
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      # 4. finally drop anything no longer in dist (old hashed assets, removed files)
      - name: Remove stale files
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --delete --size-only

      - name: Summary
        run: |
          echo "Deployed $(git rev-parse --short HEAD) to https://$BUCKET/" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/assets >> "$GITHUB_STEP_SUMMARY"
