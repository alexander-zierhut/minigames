name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: minigames.alzlper.com
  AWS_DEFAULT_REGION: nl-ams
  S3_ENDPOINT: https://s3.nl-ams.scw.cloud
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (hashed bundle in dist/)
        run: node build.mjs

      # 1. hashed assets first: immutable, cached for a year, never overwritten
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --endpoint-url "$S3_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --size-only

      # 2. then the entry point, which must always be fetched fresh
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      # 3. finally drop assets no longer referenced (old hashes) and any stray root files
      - name: Remove old assets
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --delete --size-only \
            --exclude "*" --include "assets/*" --include "index.html"
          aws s3 rm "s3://$BUCKET/client" --recursive --endpoint-url "$S3_ENDPOINT" || true

      - name: Summary
        run: |
          echo "Deployed $(git rev-parse --short HEAD) to https://$BUCKET/" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/assets >> "$GITHUB_STEP_SUMMARY"
